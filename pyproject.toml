[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "checkleaked-spotify-mcp"
version = "0.1.1"
description = "MCP server for Spotify data: play counts, monthly listeners, charts, artist stats, albums, playlists and ISRC lookup for Claude, Cursor and VS Code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eduardo Airaudo", email = "airaudoeduardo@gmail.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "spotify",
    "spotify-api",
    "play-count",
    "monthly-listeners",
    "spotify-charts",
    "claude",
    "cursor",
    "checkleaked",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0,<3",
    "checkleaked-spotify-api>=2.1.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
checkleaked-spotify-mcp = "checkleaked_spotify_mcp.server:main"

[project.urls]
Homepage = "https://spotify.checkleaked.cc"
Repository = "https://github.com/eduair94/spotify-data-mcp"
Issues = "https://github.com/eduair94/spotify-data-mcp/issues"
Documentation = "https://github.com/eduair94/spotify-data-mcp#readme"
"API reference" = "https://spotify-proxy.checkleaked.cc/docs"
Pricing = "https://spotify.checkleaked.cc/pricing"

[tool.hatch.build.targets.wheel]
packages = ["src/checkleaked_spotify_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "server.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: calls the real API with SPOTIFY_API_KEY (skipped unless SPOTIFY_MCP_LIVE=1)",
]
